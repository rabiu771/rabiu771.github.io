
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ROBOT - Personal AI Assistant</title>

  <link rel="stylesheet" href="style.css">

  <script src="script.js" defer></script>
</head>

<body>

  <main class="app">

    <header>
      <h1>ROBOT</h1>
      <p class="subtitle">YOUR PERSONAL AI ASSISTANT</p>
    </header>

    <section class="assistant">

      <div class="orb">
        <div class="inner-orb">R</div>
      </div>

      <p id="status">ROBOT IS READY</p>

      <button id="mic" type="button">
        🎙️ TALK TO ROBOT
      </button>

    </section>

    <section class="conversation">

      <h2>Conversation</h2>

      <div class="chat">
        <p id="response">
          Hello! I am ROBOT. How can I help you?
        </p>
      </div>

      <div class="message-box">

        <input
          id="message"
          type="text"
          placeholder="Talk to ROBOT..."
        >

        <button id="send" type="button">
          SEND
        </button>

      </div>

    </section>

    <footer>
      <p>ROBOT AI SYSTEM © 2026</p>
    </footer>

  </main>

</body>
</html>
