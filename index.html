<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NaijaConnect 🇳🇬</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial;background:#f0f2f5;color:#111}
body.dark{background:#18191a;color:#eee}
header{background:#008751;color:white;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header b{font-size:20px} header button{background:white;color:#008751;border:none;padding:7px 12px;border-radius:20px;font-weight:bold;cursor:pointer}
.container{max-width:550px;margin:auto;padding:12px}
.card{background:white;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
body.dark .card{background:#242526}
input,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;margin:5px 0;font-size:15px}
body.dark input,body.dark textarea{background:#3a3b3c;color:white;border-color:#555}
.post-btn{background:#008751;color:white;border:none;padding:11px;border-radius:8px;width:100%;font-weight:bold;font-size:16px;cursor:pointer}
.post{display:flex;gap:10px}
.avatar{width:45px;height:45px;border-radius:50%;object-fit:cover;background:#008751;flex-shrink:0}
.post-img{width:100%;border-radius:10px;margin-top:8px;max-height:400px;object-fit:cover}
.actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.actions button{border:none;background:#f0f2f5;padding:7px 12px;border-radius:20px;cursor:pointer}
body.dark .actions button{background:#3a3b3c;color:white}
.del{color:red!important;background:#ffe5e5!important}
.top-profile{display:flex;align-items:center;gap:10px}
.top-profile img{width:60px;height:60px;border-radius:50%;object-fit:cover;background:#008751}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;padding:10px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;background:#e0e0e0}
.tabs button.active{background:#008751;color:white}
.strength{height:8px;background:#eee;border-radius:10px;overflow:hidden;margin:5px 0}
.strength div{height:100%;width:0%;transition:0.3s}
.hint{font-size:12px;color:#666;line-height:1.5}
body.dark .hint{color:#aaa}
.logout{background:#ff3b30!important;color:white!important}
</style>
</head>
<body>
<header><b>🇳🇬 NaijaConnect</b><button onclick="toggleDark()">🌙 Dark</button></header>
<div class="container">
<div class="card" id="authCard">
<div class="tabs">
<button id="tabLogin" class="active" onclick="showTab('login')">Login</button>
<button id="tabSignup" onclick="showTab('signup')">Sign Up</button>
</div>
<div id="loginBox">
<input id="loginEmail" placeholder="Email e.g rabiu@gmail.com">
<input id="loginPass" type="password" placeholder="Password">
<button class="post-btn" onclick="login()">Login 🚀</button>
</div>
<div id="signupBox" style="display:none">
<input id="signName" placeholder="Full Name e.g Rabiu Musa">
<input id="signEmail" placeholder="Email e.g rabiu@gmail.com">
<input id="signPass" type="password" placeholder="Create Strong Password" oninput="checkStrength()">
<div class="strength"><div id="strengthBar"></div></div>
<div class="hint" id="strengthText">Password must have: 8+ characters, Capital, small, Number & Symbol (!@#$)</div>
<div class="hint">✅ 8+ chars<br>✅ A-Z Capital<br>✅ a-z small<br>✅ 0-9 Number<br>✅ !@#$ Symbol</div>
<button class="post-btn" onclick="signup()">Create Account ✅</button>
</div>
</div>
<div id="mainApp" style="display:none">
<div class="card">
<div class="top-profile">
<img id="myAvatar" src="https://ui-avatars.com/api/?background=008751&color=fff&name=R">
<div><b id="welcomeName">Welcome!</b><br><small id="welcomeEmail"></small></div>
</div>
<input type="file" accept="image/*" onchange="setAvatar(event)">
<button class="post-btn logout" style="margin-top:8px" onclick="logout()">Logout</button>
</div>
<div class="card">
<textarea id="postText" rows="3" placeholder="Wetin dey happen, Naija? 🇳🇬"></textarea>
<input type="file" id="postImage" accept="image/*">
<button class="post-btn" onclick="addPost()">Post Am! 🚀</button>
</div>
<div id="feed"></div>
</div>
</div>
<script>
let users = JSON.parse(localStorage.getItem('nc_users')||'[]');
let currentUser = JSON.parse(localStorage.getItem('nc_current')||'null');
let myAvatar = localStorage.getItem('nc_avatar')||'https://ui-avatars.com/api/?background=008751&color=fff&name=R';
if(localStorage.getItem('nc_dark')=='1') document.body.classList.add('dark');
function toggleDark(){ document.body.classList.toggle('dark'); localStorage.setItem('nc_dark',document.body.classList.contains('dark')?'1':'0'); }
function showTab(t){ document.getElementById('tabLogin').classList.toggle('active',t=='login'); document.getElementById('tabSignup').classList.toggle('active',t=='signup'); document.getElementById('loginBox').style.display=t=='login'?'block':'none'; document.getElementById('signupBox').style.display=t=='signup'?'block':'none'; }
function checkStrength(){ let p=document.getElementById('signPass').value; let score=0; if(p.length>=8) score++; if(/[A-Z]/.test(p)) score++; if(/[a-z]/.test(p)) score++; if(/[0-9]/.test(p)) score++; if(/[^A-Za-z0-9]/.test(p)) score++; let bar=document.getElementById('strengthBar'); let colors=['#ff3b30','#ff9500','#ffcc00','#34c759','#008751']; bar.style.width=(score*20)+'%'; bar.style.background=colors[score-1]||'#eee'; let texts=['Too Weak ❌','Weak ❌','Fair ⚠️','Good 👍','STRONG ✅','VERY STRONG 🔥']; document.getElementById('strengthText').innerText=texts[score]+' - Must have: 8+ chars, Capital, small, Number & Symbol'; }
function isStrong(p){ return p.length>=8 && /[A-Z]/.test(p) && /[a-z]/.test(p) && /[0-9]/.test(p) && /[^A-Za-z0-9]/.test(p); }
function signup(){ let name=document.getElementById('signName').value.trim(); let email=document.getElementById('signEmail').value.trim().toLowerCase(); let pass=document.getElementById('signPass').value; if(!name||!email||!pass) return alert('Fill all fields!'); if(!email.includes('@')) return alert('Enter correct email!'); if(!isStrong(pass)) return alert('Password too weak!\\nMust have:\\n- 8+ characters\\n- 1 Capital (A-Z)\\n- 1 Small (a-z)\\n- 1 Number\\n- 1 Symbol (!@#$)\\n\\nExample: Rabiu@123'); if(users.find(u=>u.email==email)) return alert('This email don register before. Go Login!'); users.push({name:name,email:email,pass:pass}); localStorage.setItem('nc_users',JSON.stringify(users)); alert('Account created! Now Login ✅'); showTab('login'); document.getElementById('loginEmail').value=email; }
function login(){ let email=document.getElementById('loginEmail').value.trim().toLowerCase(); let pass=document.getElementById('loginPass').value; let user=users.find(u=>u.email==email && u.pass==pass); if(!user) return alert('Wrong Email or Password! Try again or Sign Up'); currentUser=user; localStorage.setItem('nc_current',JSON.stringify(user)); showApp(); }
function logout(){ localStorage.removeItem('nc_current'); currentUser=null; document.getElementById('authCard').style.display='block'; document.getElementById('mainApp').style.display='none'; }
function setAvatar(e){ let r=new FileReader(); r.onload=()=>{myAvatar=r.result;localStorage.setItem('nc_avatar',myAvatar);document.getElementById('myAvatar').src=myAvatar;}; r.readAsDataURL(e.target.files[0]); }
function showApp(){ if(!currentUser) return; document.getElementById('authCard').style.display='none'; document.getElementById('mainApp').style.display='block'; document.getElementById('welcomeName').innerText='Welcome, '+currentUser.name+' 👋'; document.getElementById('welcomeEmail').innerText=currentUser.email; document.getElementById('myAvatar').src=myAvatar; render(); }
let posts = JSON.parse(localStorage.getItem('nc_posts')||'[]');
posts = posts.map(p => ({name:p.name||'Anonymous', avatar:p.avatar||'https://ui-avatars.com/api/?background=008751&color=fff&name=R', text:p.text||'', img:p.img||'', likes:p.likes||0, love:p.love||0, laugh:p.laugh||0, time:p.time||'Just now'}));
localStorage.setItem('nc_posts', JSON.stringify(posts));
function addPost(){ let text=document.getElementById('postText').value.trim(); let file=document.getElementById('postImage').files[0]; if(!text && !file) return alert('Write something or add picture'); if(file){ let r=new FileReader(); r.onload=()=>{savePost(text,r.result);}; r.readAsDataURL(file); } else savePost(text,''); }
function savePost(text,img){ posts.unshift({name:currentUser?currentUser.name:'Anonymous',avatar:myAvatar,text:text,img:img,likes:0,love:0,laugh:0,time:new Date().toLocaleString()}); localStorage.setItem('nc_posts',JSON.stringify(posts)); document.getElementById('postText').value=''; document.getElementById('postImage').value=''; render(); }
function delPost(i){ if(confirm('Delete this post?')){posts.splice(i,1);localStorage.setItem('nc_posts',JSON.stringify(posts));render();} }
function react(i,type){ posts[i][type]++; localStorage.setItem('nc_posts',JSON.stringify(posts)); render(); }
function render(){ let f=document.getElementById('feed'); if(!f) return; if(posts.length==0) f.innerHTML='<div class="card" style="text-align:center">No post yet. Be the first! 🇳🇬</div>'; else f.innerHTML=posts.map((p,i)=>`<div class="card"><div class="post"><img class="avatar" src="${p.avatar}"><div><b>${p.name}</b><br><small>${p.time}</small><p style="margin:8px 0">${p.text}</p></div></div>${p.img?`<img class="post-img" src="${p.img}">`:''}<div class="actions"><button onclick="react(${i},'likes')">👍 Like ${p.likes||0}</button><button onclick="react(${i},'love')">❤️ Love ${p.love||0}</button><button onclick="react(${i},'laugh')">😂 Laugh ${p.laugh||0}</button><button class="del" onclick="delPost(${i})">🗑️ Delete</button></div></div>`).join(''); }
if(currentUser) showApp(); else render();
</script>
</body>
</html>
